name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # editable install: esercita lo stesso pip install -e . che userebbe
      # chiunque installi il pacchetto, con i range di versione di
      # pyproject.toml (più robusto su più Python di requirements.txt, che
      # ha pin esatti pensati per il deploy, non per la matrice CI)
      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check portfolio_intelligence/ app.py tests/ migrations/ main.py analyze_nasdaq100.py download_nasdaq100.py fundamentals_report.py

      - name: Format check
        run: ruff format --check portfolio_intelligence/ app.py tests/ migrations/ main.py analyze_nasdaq100.py download_nasdaq100.py fundamentals_report.py

      - name: Type check
        run: mypy portfolio_intelligence/

      - name: Tests (con coverage, soglia e config in pyproject.toml)
        run: pytest -v

      - name: Migrations apply cleanly
        run: DATABASE_URL="sqlite:////tmp/ci_migrations.db" alembic upgrade head
